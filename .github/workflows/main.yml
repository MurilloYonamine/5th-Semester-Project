name: Build & Release 🚀
permissions:
  contents: write

on:
  push:
    branches: [main]

env:
  GAME_NAME: Photossync
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build Unity 🎮
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0 

      - name: Pull LFS Assets
        run: |
          git lfs install
          git lfs pull

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}

      - name: Build Unity Project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          buildName: ${{ env.GAME_NAME }}

      - name: Zip Temporary Build
        run: |
          cd build/StandaloneWindows64
          zip -r "../../${GAME_NAME}_temp.zip" .
          cd ../..

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-zip
          path: ${{ env.GAME_NAME }}_temp.zip          

  release:
    name: Semantic Release 🧠
    runs-on: ubuntu-latest
    needs: build 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-zip

      - name: Run Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          branches: main

      - name: Rename Executable & Package Release Zip
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEMVER: ${{ steps.semantic.outputs.new_release_version }}
        run: |
          TAG="v${SEMVER}"
          FOLDER_NAME="${GAME_NAME}_${TAG}"
          RELEASE_ZIP="${FOLDER_NAME}.zip"
          
          # Unzip temporary build into a named folder (ex: Photossync_v1.0.0)
          mkdir -p "dist/${FOLDER_NAME}"
          unzip -q ${GAME_NAME}_temp.zip -d "dist/${FOLDER_NAME}"
          
          # Rename executable inside folder (ex: Photossync_v1.0.0.exe)
          if [ -f "dist/${FOLDER_NAME}/${GAME_NAME}.exe" ]; then
            mv "dist/${FOLDER_NAME}/${GAME_NAME}.exe" "dist/${FOLDER_NAME}/${FOLDER_NAME}.exe"
          fi
          
          # Zip root folder so extracting zip yields Photossync_v1.0.0/ folder
          cd dist
          zip -r "../${RELEASE_ZIP}" "${FOLDER_NAME}"
          cd ..
          
          # Upload final zip to GitHub Release
          gh release upload "${TAG}" "${RELEASE_ZIP}"